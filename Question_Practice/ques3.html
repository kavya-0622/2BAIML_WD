<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Employee{
            constructor(id, name, basicSalary){
                this.id = id;
                this.name = name;
                this.basicSalary = basicSalary;
            }

            calculateSalary(){
                return this.basicSalary;
            }
        }

        class Manager extends Employee{
            constructor(id, name, basicSalary, incentives){
                super(id, name, basicSalary);
                this.incentives = incentives;
            }

            calculateSalary(){
                return this.basicSalary + this.incentives;
            }
        }

        let emp1 = new Employee(101, "Ram", 10000)
        let emp2 = new Employee(1102, "Raghav", 25000)

        console.log(`Employee Salary: ${emp1.calculateSalary()}`);
        console.log(`Manager Salary: ${emp2.calculateSalary()}`);

    </script>
</body>
</html>
